<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC",Georgia,serif;min-height:100vh;background-image:radial-gradient(rgba(70,50,30,.035) .7px,transparent .8px);background-size:5px 5px}button{font:inherit;color:inherit;cursor:pointer}#app{max-width:780px;margin:0 auto;padding:22px 22px 70px;min-height:100vh}.watermark{position:fixed;top:12px;left:14px;z-index:30;font:700 12px/1.1 Arial,sans-serif;letter-spacing:2px;color:#b86545;opacity:.75;pointer-events:none}.watermark span{display:block;font-size:7px;letter-spacing:1.8px;margin-top:3px;color:#8b806f}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:5px 0 12px;margin-top:28px;font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted)}.screen{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.eyebrow{font:10px Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;color:var(--accent);margin:0 0 14px}.hero{padding:12vh 0 8vh}.hero .mark{font:italic 18px Georgia,serif;color:var(--accent);margin-bottom:22px}.hero h1{font-size:clamp(38px,10vw,68px);line-height:1.12;letter-spacing:-2px;margin:0 0 18px;font-weight:500}.hero h1 span{display:block;color:var(--accent);font-style:italic;font-size:.68em;letter-spacing:-.6px;margin-top:8px}.hero p{font-size:15px;line-height:2;color:#655c51;max-width:570px;margin:26px 0}.hero .meta{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted);margin:32px 0}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:15px 22px;font-size:13px;letter-spacing:1px;transition:.2s;display:inline-flex;align-items:center;gap:12px}.btn:hover{background:var(--accent);border-color:var(--accent)}.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.btn.secondary:hover{border-color:var(--accent);color:var(--accent)}.intro-note{border-left:2px solid var(--accent);padding:8px 0 8px 17px;color:var(--muted);font-size:12px;line-height:1.9;margin-top:40px}.chapter-head{padding:7vh 0 3vh}.chapter-num{font:italic 48px Georgia,serif;color:var(--accent);opacity:.85}.chapter-head h2{font-size:clamp(26px,6vw,42px);font-weight:500;margin:10px 0 6px}.chapter-head .en{font:11px Arial,sans-serif;letter-spacing:2.3px;color:var(--muted)}.chapter-head p{font-size:14px;line-height:2;color:#716759;max-width:600px;margin-top:24px}.progress-wrap{height:3px;background:var(--paper2);margin:12px 0 26px}.progress{height:3px;background:var(--accent);width:0;transition:width .3s}.q-meta{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted);margin:0 0 18px}.question h3{font-size:clamp(23px,6vw,34px);line-height:1.45;font-weight:500;margin:0 0 8px}.question .q-en{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted);margin-bottom:20px}.question .stem{font-size:14px;line-height:2.05;color:#61584d;margin:0 0 25px}.options{display:grid;gap:11px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;background:rgba(255,250,242,.48);border:1px solid var(--line);padding:15px 15px;line-height:1.85;font-size:14px;transition:all .2s}.option .letter{font:12px Georgia,serif;color:var(--accent);min-width:16px;padding-top:2px}.option:hover{border-color:var(--accent);background:#f0e5d6}.option.selected{border-color:var(--accent);background:#ead9c7;box-shadow:inset 3px 0 0 var(--accent)}.navrow{display:flex;justify-content:space-between;gap:10px;margin:28px 0 8px}.navrow .btn{min-width:120px;justify-content:center}.chapter-end{padding:5vh 0 3vh}.chapter-end .chapter-stamp{font:italic 20px Georgia;color:var(--accent)}.chapter-end h2{font-size:30px;font-weight:500;line-height:1.4}.chapter-end p{line-height:2;color:#716759;font-size:14px}.result-section{border-top:1px solid var(--line);padding:34px 0}.result-section:first-child{border:0}.result-kicker{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--accent);margin-bottom:14px}.result-section h2{font-size:clamp(26px,7vw,42px);font-weight:500;line-height:1.25;margin:0 0 10px}.result-section h3{font-size:20px;font-weight:500;margin:0 0 12px}.result-section p{font-size:14px;line-height:2.05;color:#62594d;margin:12px 0}.result-quote{font-style:italic;font-size:17px;line-height:1.8;color:#55493d;border-left:2px solid var(--accent);padding-left:16px;margin:22px 0}.score-big{font-size:48px;color:var(--accent);font-family:Georgia,serif}.score-label{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted)}.subtype{font-size:22px;color:var(--accent);margin-top:6px}.result-top{background:#ede3d5;padding:24px 20px;margin:20px 0;border:1px solid #d9c8b4}.result-top .philosophy-name{font-size:clamp(32px,8vw,48px);line-height:1.2;margin:0}.result-top .alias{font-size:20px;color:var(--accent);margin:9px 0 18px}.score-meter{height:5px;background:#d6c8b7;margin:12px 0 8px}.score-meter>div{height:100%;background:var(--accent)}.result-flex{display:flex;align-items:center;gap:20px}.result-flex .score-side{min-width:105px}.radar-wrap{max-width:430px;margin:12px auto}.radar-wrap canvas{width:100%;height:auto;display:block}.ranking{display:grid;gap:12px;margin-top:20px}.rank-row{display:grid;grid-template-columns:28px 1fr 45px;gap:10px;align-items:center}.rank-no{font:11px Georgia,serif;color:var(--muted)}.rank-name{font-size:13px}.rank-track{height:6px;background:#dfd5c7;margin-top:6px}.rank-fill{height:100%;background:var(--accent)}.rank-value{text-align:right;font:12px Georgia,serif;color:var(--accent)}.tension-card{border:1px solid var(--line);padding:20px;margin:20px 0;background:rgba(255,250,242,.42)}.tension-card h3{font-size:22px}.report-block{padding:17px 0;border-top:1px solid var(--line)}.report-block:first-child{border-top:0}.report-block .label{font:10px Arial,sans-serif;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}.report-block h3{font-size:18px}.report-block p{margin:0}.report-foot{font-size:11px;color:var(--muted);line-height:1.9;margin-top:26px}.finale{background:#eee4d6;padding:30px 24px;margin:15px 0 25px;text-align:left}.finale h2{font-size:30px;line-height:1.4;margin:0 0 15px;font-weight:500}.finale p{font-size:14px;line-height:2;color:#62594d}.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.result-actions button{flex:1;min-width:145px}.hidden{display:none!important}.smallprint{font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.5px;line-height:1.8}.chapter-chip{display:inline-block;border:1px solid var(--line);padding:5px 9px;font:9px Arial,sans-serif;letter-spacing:1px;color:var(--muted);margin:0 0 18px}.divider{border:0;border-top:1px solid var(--line);margin:24px 0}.report-print{display:none}
@media(max-width:480px){#app{padding:16px 18px 50px}.hero{padding:10vh 0 7vh}.hero h1{letter-spacing:-1.4px}.topline{font-size:9px}.option{padding:13px 12px;font-size:13px}.navrow .btn{min-width:0;flex:1;padding:13px 10px}.result-top{padding:19px 16px}.result-section{padding:28px 0}.result-flex{gap:10px}.score-side{min-width:85px!important}.score-big{font-size:40px}}

<div class="watermark">Tami<span>PHILOSOPHY STUDIO</span></div>
<div id="app"><div class="topline"><span>TAMI · PHILOSOPHY STUDIO</span><span>A TEST OF YOUR LIFE PHILOSOPHY</span></div><main id="main"></main></div>
<script>
const types=[
{id:'hed',name:'享乐主义',alias:'清醒的享乐者',en:'HEDONISM',quote:'快乐并非人生的奖赏。它本身就是值得追求的生活。',desc:'你不愿把快乐推迟到某个遥远的未来，也不认为人生必须先完成某种使命，才有资格被享受。对你而言，感受生命、减少不必要的痛苦，并非肤浅的追求。你警惕将忍耐奉为美德，也警惕那些不断要求你牺牲当下的宏大承诺。',shadow:'当快乐成为衡量一切的尺度，长期价值、责任或难以避免的痛苦可能被过早排除。并非所有值得的事都令人愉悦，也并非所有不愉悦的事都毫无价值。',report:['你不愿将人生变成一场无限延期的兑现。快乐对你并非成功之后的奖励，而是生活本身的一种正当价值。','你可能更重视真实的体验，而非仅仅拥有某种被社会认可的成果。你会问：我得到的究竟是生活，还是一张证明自己活得正确的成绩单？','面对痛苦，你倾向于减少无谓的折磨，而不是将苦难浪漫化。但有时，逃离不适也可能让你错过那些需要耐心才能抵达的价值。','你愿意与他人分享快乐，但不太愿意让集体期待定义你的幸福。你会保留自己的欲望与生活尺度。','未来值得规划，却不应该吞噬现在。你想要的不是永远准备好再开始生活，而是在仍然拥有时间时，真正经历它。']},
{id:'util',name:'功利主义',alias:'幸福的计算者',en:'UTILITARIANISM',quote:'一个选择的价值，最终要由它带来的真实影响来衡量。',desc:'你习惯将选择放回结果之中考量。动机固然重要，但你并不认为善意足以抵消造成的伤害。你关注行动究竟改善了什么、让谁受益、又让谁承担代价。对你而言，道德不是为了维持自我形象，而是要回应现实世界中真实发生的事情。',shadow:'当结果成为唯一尺度，个体的尊严、不可侵犯的边界或那些无法被量化的价值，可能被牺牲在整体收益的名义之下。',report:['你更愿意以行动产生的影响判断价值。愿望与原则固然重要，但若它们无法回应真实处境，你会质疑其意义。','你倾向于考虑资源、代价与结果，而不是只关注选择是否让自己感到道德上纯粹。','你可能认为痛苦值得被减少，而不是被赋予某种高贵的意义。若有方法能避免伤害，你会认真考虑它。','你关注人与人之间的实际处境。善意是否带来帮助，比善意是否看起来纯粹更值得观察。','你对未来抱有一种责任感：今天的决定可能影响许多尚未出现的人。你愿意把他们的利益纳入自己的判断。']},
{id:'exist',name:'存在主义',alias:'意义的造物者',en:'EXISTENTIALISM',quote:'世界未必有答案，但我仍有权决定，如何度过我的一生。',desc:'你并不急于从世界那里获得一个标准答案。人生或许没有预先写好的意义，也没有一条被证明正确的道路。你不愿将自己交给既定解释；意义更像是在一次次选择、承担与经历之中逐渐形成的东西。',shadow:'当一切意义都需要由自己创造，选择也可能带来沉重的责任。自由并不总令人轻盈；有时它意味着无法将人生的决定推托给任何外在答案。',report:['你不急于从世界那里获得一个标准答案。比起得到确定的解释，你更愿意保留思考的空间。','意义对你而言不是等待发现的真相，而是在选择、承担与经历中逐渐形成的东西。你可能不愿让传统或他人的期待替你决定人生方向。','痛苦未必有预设意义，但你仍可以决定如何回应它。你不需要相信苦难是安排好的，才能在经历之后继续生活。','你允许他人拥有不同的答案，也希望自己的选择不被轻易代替。你珍视的不是永远正确，而是能够为自己的决定负责。','未来并非一条已经写好的道路。即使没有保证，你仍愿意通过行动让某些可能成为现实。']},
{id:'nih',name:'虚无主义',alias:'清醒的空茫人',en:'NIHILISM',quote:'如果意义并非天生存在，那么我们所坚信的一切，也值得重新审视。',desc:'你对被奉为理所当然的价值保持警觉。那些宏大的目标、普遍认可的成功标准，未必拥有它们宣称的绝对性。你不轻易接受意义，也不急于用新的信念填补旧信念留下的空白。',shadow:'持续拆解价值，却不愿建立任何暂时的立场，可能让行动失去支点。怀疑能够揭开幻象，也可能使一切都变得难以投入。',report:['你对既定意义保持距离。许多被视为理所当然的目标，在你看来可能只是集体重复的叙事。','你不容易被宏大的承诺说服。你会怀疑所谓人生使命是否只是人们为了抵抗不确定性而构建的解释。','痛苦未必会带来成长，失去也不必被包装成礼物。你倾向于承认经历本身可能没有更深的寓意。','你会审视关系、道德与社会价值背后的理由，不愿因为某种观念被广泛接受就停止追问。','未来并不天然保证改善。你可能拒绝用乐观的故事覆盖未知，但这并不必然意味着你停止生活或体验。']},
{id:'pess',name:'悲观主义',alias:'风暴的预言者',en:'PESSIMISM',quote:'看见可能的失望，并不意味着必须假装它不存在。',desc:'你习惯提前看见风险、损失与事物可能走向的阴影。你不轻易将希望当作证据，也不愿用积极叙事遮盖现实的不确定。谨慎对你而言不是缺乏勇气，而是一种拒绝自我欺骗的方式。',shadow:'过度预演失败，可能让尚未发生的损失提前占据生活。风险意识若成为唯一视角，可能使希望与新的可能性难以进入。',report:['你不轻易相信事情会自动朝好的方向发展。希望需要依据，而不是仅凭愿望就被视为结论。','你对快乐与成功保留谨慎，可能更愿意提前考虑代价，以免被过度期待拖入失望。','痛苦不一定能让人变得更好。你不愿把伤害美化成必经的成长仪式。','你看待他人时也许较少浪漫化动机。你更关注关系中可能出现的失衡、隐瞒与代价。','你为未来留有准备，未必是因为相信一切会顺利，而是因为不确定性本身值得认真对待。']},
{id:'opt',name:'乐观主义',alias:'未知的信奉者',en:'OPTIMISM',quote:'未来尚未发生，因此它仍然保留改变的可能。',desc:'你愿意为尚未出现的可能性留下位置。乐观对你而言并不是否认困难，而是不把眼前的阻碍视为最终结论。即使现实并不理想，你仍倾向于相信行动、时间或新的条件可能带来变化。',shadow:'期待改善有时会让你低估风险，或将暂时的挫折解释得过轻。希望值得保留，但不必承担替现实遮蔽的职责。',report:['你愿意为未来留下空间。眼前的困难并不自动成为最终结局，你仍相信某些事情可以被改变。','你更倾向于把目标视为可能，而不是提前认定它会失败。你愿意尝试，给尚未发生的事一点机会。','面对痛苦，你可能寻找能够继续向前的解释或路径。但你也需要记得，不必每一次受伤都立即变成成长。','你仍愿意相信他人能够改变，善意可以延续，关系也可能在理解与行动中修复。','你对未来保留期待。它未必是确定的信念，更像一种愿意继续行动的理由。']},
{id:'real',name:'现实主义',alias:'大地的观察者',en:'REALISM',quote:'愿望可以描绘世界，但不能替代世界本身。',desc:'你倾向于从现实条件出发理解问题。理想、情绪与愿望并非毫无价值，但它们不能自动改变资源、限制、利益与客观处境。你更愿意看清事情实际如何运作，再决定投入多少期待。',shadow:'当现实成为唯一可信的尺度，尚未存在的可能性可能被过早排除。看清限制是一种能力，但并不意味着所有限制都永远不可改变。',report:['你习惯先看事情实际如何运作，而不是它理应如何。愿望可以存在，但不能代替对条件的判断。','你不容易被理想化的生活叙事打动。你更关心一个选择是否可行，以及它可能带来的真实代价。','面对痛苦，你倾向于承认事实，而不是用积极解释覆盖它。接受现实不一定是认输，也可能是重新判断的起点。','你观察他人时重视行动与处境。你可能不轻易相信表态，但也知道人的行为受到环境与利益共同影响。','你对未来的期待通常带有条件。你会考虑资源、概率与限制，而不是把愿望当作必然发生的事。']},
{id:'ideal',name:'理想主义',alias:'理想的守夜人',en:'IDEALISM',quote:'世界尚不完美，正是我不愿停止相信的理由。',desc:'你相信某些价值不应仅因现实困难就被放弃。理想对你不是装饰性的愿望，而是衡量现实、决定方向的一把尺。即使知道改变缓慢、代价真实，你仍可能认为有些事情值得坚持。',shadow:'理想若成为不可质疑的标准，也可能使现实中的人和自己承受过多要求。坚持信念与拒绝变化之间，需要保留辨别的空间。',report:['你不愿让现实直接决定什么值得追求。即使某种改变困难重重，你仍认为它可能值得尝试。','你可能对现状有较高期待，也愿意为了更好的生活承受部分不便。你不满足于仅仅适应已有世界。','痛苦或挫折不会自动使信念失效。你可能从经历中获得坚持的理由，但并不需要将苦难视为理想的证明。','你看待人与社会时，会在意公平、尊严与应当如何相处。某些底线不该只根据便利或利益而改变。','你对未来保留理想的轮廓。它可能尚未实现，却仍能影响你今天的选择与方向。']},
{id:'perf',name:'完美主义',alias:'秩序的执笔者',en:'PERFECTIONISM',quote:'尚未抵达理想，并不妨碍我继续校准方向。',desc:'你对完成、质量与标准有自己的要求。你可能很难满足于“差不多”，因为你看得见细节、偏差与尚未兑现的潜能。对你而言，完善并不只是追求外部评价，也可能是对自己所做之事的一种认真。',shadow:'标准若不断上移，完成便可能永远被延期。你可能难以享受成果，甚至将可修正之处误认为不可接受的缺陷。',report:['你对完成有自己的标准。你可能不容易满足于仅仅交付，而希望事情尽可能接近心中理想的形态。','你会注意到细节与不足。它们既可能成为精进的动力，也可能使你难以停下来承认已经足够。','面对挫折，你可能更倾向于修正、补足或寻找可改善的部分。需要留意，并非所有事情都能通过持续努力变得完美。','你对关系与他人也可能有期待。认真本身没有问题，但人与人之间未必能按照同一套标准完成。','未来可能被你理解为不断优化的过程。你愿意继续推进，但也需要给完成、休息与偶然留下位置。']},
{id:'lib',name:'自由主义',alias:'自由的守望者',en:'LIBERALISM',quote:'一个人的选择权，不应只在多数人赞同的时候才被承认。',desc:'你重视个体的自主、权利与边界。共同生活需要规则，但规则并不因被广泛接受就天然正当。你倾向于警惕权力替个人决定什么才是正确人生，也重视人们在不伤害他人的前提下保有不同选择的空间。',shadow:'强调个人自主时，可能低估共同责任、相互依赖与结构性条件。自由并不总能单独解决人与人之间的冲突。',report:['你重视个体拥有选择生活方式的权利。你不认为多数人的偏好足以自动成为所有人的义务。','你愿意为自主空间保留边界。规则需要理由，限制也应当接受检验，而非只因长期存在就被视为合理。','面对痛苦或困境，你可能不喜欢他人替你定义该如何生活。你更希望拥有决定自身回应的空间。','你尊重他人与自己不同的价值与选择。自由不仅是自己不受干预，也意味着承认别人不必按照你的标准生活。','你希望未来仍有多种可能，而不是被某一种单一的生活范本所规定。']},
{id:'fatal',name:'宿命论',alias:'命运的旁观者',en:'FATALISM',quote:'有些结局也许并不因我们的意志而改变。',desc:'你倾向于承认人生存在某些无法逃避的限制，甚至有些结果可能无论如何努力都无法改变。你对控制感保持怀疑，也不总认为行动能够决定最终结局。',shadow:'若过早认定结局已定，可能让仍然存在的选择失去意义。承认不可控与放弃行动，并不是同一件事。',report:['你承认人生中存在无法由个人意志改变的部分。某些结局也许并不会因为努力、计划或希望而改写。','你可能不愿把所有结果都归因于个人选择。人生有时会被偶然、外部力量或无法预见的条件推向某处。','面对失去，你未必相信每件事都能通过行动挽回。接受不可更改的部分，可能是你理解生活的一种方式。','你对他人与世界也保留这种认识：人并非总能完全控制自己的处境或选择。','未来对你而言并非完全开放。你可能愿意行动，但不一定相信行动能够改变所有终点。']},
{id:'det',name:'决定论',alias:'因果的阅读者',en:'DETERMINISM',quote:'选择并非凭空出现；每个决定都拥有它的来处。',desc:'你倾向于将事件放入因果链中理解。性格、经历、环境、信息与当时条件共同塑造决定。你不轻易把人的行为解释为毫无来由的自由意志，也认为理解原因比简单归咎更重要。',shadow:'过度强调因果可能模糊责任与改变的意义。理解一个决定为何发生，不必意味着它的后果无需面对。',report:['你倾向于相信事情并非凭空发生。选择受到经历、环境、性格与条件影响，理解这些因素比单纯归因更重要。','你可能不把自由理解为完全脱离因果。即使选择受到条件塑造，行动仍是因果过程的一部分。','面对痛苦与挫折，你会尝试追溯其形成条件。理解原因不必等于接受结果，更可能帮助看见下一步。','你对他人行为也倾向于寻找背景与动因。你可能较少把人简单归为天生善恶，而更关注促成行为的条件。','你理解未来为持续发生的因果过程。改变条件可能影响走向，但并不存在脱离所有来由的决定。']},
{id:'stoic',name:'斯多葛主义',alias:'沉静的掌舵人',en:'STOICISM',quote:'我无法决定风向，但仍能练习如何握住自己的舵。',desc:'你试图区分外部事件与自身能够回应的部分。你并不一定认为世界会变得公平或顺遂，但不愿让无法控制的事情完全支配内心。你重视判断、节制与行动，把力量放在自己仍能负责的范围之内。',shadow:'若将接纳理解为必须沉默，可能压抑真实情绪或忽视需要改变的处境。平静不是否认痛苦，也不是对不公无动于衷。',report:['你会努力区分哪些事情能够影响，哪些只能面对。并非所有外部结果都值得耗尽心力，但自己的判断与回应仍然属于你。','你倾向于节制欲望，不让未能得到的东西决定全部生活。并非不渴望，而是希望渴望不成为支配。','痛苦无法总被避免，但你可能尝试不让它扩张为对整个生命的判决。你重视内在的秩序与承受能力。','你认为人与人之间有值得遵守的原则，但也不会将他人的行为完全交由自己控制。','未来不必完全顺从期待。你更在意面对变化时，能否守住自己的判断与行动方式。']},
{id:'cyn',name:'犬儒主义',alias:'人性的审视者',en:'CYNICISM',quote:'当价值成为表演，我更愿意追问它背后的动机。',desc:'你对社会惯例、道德表象与人们宣称的动机保持审视。你不轻易被身份、声誉或漂亮话说服，更愿意观察利益与行为之间的关系。你怀疑被包装的欲望，却也可能向往更坦率、不依赖虚荣的生活。',shadow:'怀疑若成为默认答案，可能使真诚也被提前判定为伪装。看见动机的复杂，并不意味着所有善意都不可信。',report:['你会留意价值观背后的利益与动机。某些被称为高尚的行为，在你看来也值得审视其实际目的。','你不轻易接受社会定义的成功、体面或道德。你可能认为许多规则只是习惯、地位与利益的产物。','面对痛苦，你不太愿意用漂亮叙事掩饰现实。你宁可承认事情复杂、动机混杂，也不急于相信理想化解释。','你对他人保持观察。善意可能真实存在，但你不会仅凭表态就认定一个人值得信任。','你对未来未必寄托在社会承诺上。你可能更希望生活少一些表演、多一些诚实与自主。']}
];
const chapters=[
{title:'意义与存在',en:'ON MEANING',desc:'我们如何理解生命的价值？意义是被发现的，还是由人亲手创造？',qs:[
['徒劳是否仍值得','ON THE VALUE OF FUTILITY','你投入了很长时间去做一件事。它最终没有改变任何现实，也没有留下值得被记住的结果。多年以后，你如何看待那段付出？',['那段时间曾让我感到愉悦，仅此便足以构成它的价值。','如果它没有产生任何结果，我很难认为这段付出值得。','结果或许尚未出现，暂时的徒劳不能证明一切毫无意义。','意义并不需要被证明。那是我曾经选择投入的生活，不必接受事后的审判。'],['hed','util','opt','exist'],['exist','real','ideal','stoic']],
['意义从何而来','ON THE ORIGIN OF MEANING','如果世间万物并没有预先设定的意义，人类所相信的一切价值，都可能只是自身赋予的解释。你更接近哪一种看法？',['意义既然能够被创造，就不必等待某种更高的答案来认可。','人类的解释不等于事物本身的价值。有些东西或许不依赖我们的理解而存在。','所谓意义可能只是对虚无的抵抗。我们需要相信些什么，才能继续生活。','意义并不是一个需要解决的问题。生命发生了，而我可以决定如何经历它。'],['exist','real','nih','hed'],['exist','ideal','nih','stoic']],
['如果人生无法重来','ON THE IRREVERSIBILITY OF LIFE','如果你有机会重回人生某个节点，并保留现在的记忆，但重新选择可能意味着失去如今拥有的一切，你会如何决定？',['我愿意重新选择。未经历的人生仍然值得探索，不该被过去锁定。','我不会重来。如今的一切都与过去有关，即使其中包含遗憾。','我会改变那些明确令我后悔的选择。没有必要为了证明过去值得而保留错误。','我无法确定另一种人生是否更好。所谓正确的版本，或许并不存在。'],['opt','stoic','real','nih'],['exist','fatal','hed','nih']],
['当无人见证你的存在','ON BEING UNSEEN','假设你所做的一切都不会被任何人知道、记住、赞赏或批评。没有社会反馈，也没有他人目光，你会如何生活？',['我依然会追求让我感到愉悦的事。生活不需要观众。','我可能会减少许多投入。既然无法产生任何影响，有些行动就失去了理由。','我仍会坚持部分信念。是否有人见证，不应该决定它们是否值得。','我会改变生活方式。人本来就通过关系确认自身，彻底脱离他人并非我想要的生活。'],['hed','util','ideal','lib'],['exist','util','ideal','real']]]},
{title:'欲望与快乐',en:'ON DESIRE',desc:'欲望是生命的动力、困境，还是永远无法填满的空缺？',qs:[
['关于未被满足的欲望','ON UNSATISFIED DESIRE','你终于得到了曾经渴望的东西。短暂的兴奋过去，它逐渐成为日常，而新的欲望再次出现。你如何看待这种循环？',['欲望本就是生命的动力。满足一个愿望之后，继续渴望别的东西并没有什么不妥。','如果幸福永远被放在下一个目标上，我可能从未真正拥有过现在。','欲望与厌倦也许本就是无法终止的循环。人很难从自身的需求中脱离。','我会区分真正需要的东西与不断膨胀的欲望，不愿被它们牵着走。'],['hed','stoic','nih','real'],['hed','exist','pess','stoic']],
['关于财富与自由','ON WEALTH AND FREEDOM','假设你拥有足够的财富，可以永远不再工作。但失去原本的工作与目标后，你也不知道该如何安排余生。',['我愿意拥有这样的生活。人生不应该把忍耐和劳作为目的。','我会重新寻找值得投入的事情。没有目标的生活可能比忙碌更令人空虚。','我最想得到的是选择的权利，而不是财富本身。未来如何生活，可以留给未来的自己。','我不确定财富是否能带来自由。失去原有结构后，人也可能陷入另一种困境。'],['hed','ideal','lib','pess'],['exist','ideal','lib','real']],
['关于失去与拥有','ON POSSESSION AND LOSS','你拥有一段关系、一种生活，或某种极其珍视的状态。但你知道它们终有可能消失。你如何理解拥有？',['拥有就是充分经历它。因为无法永远留住，所以更不应该拒绝当下。','我珍惜，但不把它视为属于我。关系与事物都有自己的轨迹。','所有拥有都只是暂时的。人或许从未真正占有过什么。','我会认真经营和保护它。无法永恒，并不意味着不值得投入。'],['hed','lib','nih','ideal'],['hed','stoic','nih','real']],
['关于幸福的延期','ON DEFERRED HAPPINESS','你正在为未来的理想生活做准备。为了那个目标，你不断放弃休息、享受、旅行，甚至某些关系。但你无法确定未来是否真的会如愿。',['只要目标值得，眼下的牺牲就有意义。未来的满足可以超过当下。','我不愿将整段人生抵押给未来。今天并不只是通往明天的工具。','人们似乎总在准备生活，却很少真正抵达。理想可能只是一种不断延长的欲望。','我会寻找两者之间的可能。未来值得准备，但当下也不该被彻底牺牲。'],['ideal','hed','nih','real'],['ideal','hed','pess','stoic']]]},
{title:'痛苦与挫折',en:'ON SUFFERING',desc:'当努力失去保证、失去无法弥补，你如何与苦难共处？',qs:[
['关于努力与回报','ON EFFORT AND REWARD','你曾相信，只要足够努力，就能获得自己想要的生活。后来你发现，有人付出更少，却拥有更多。你开始怀疑努力与结果之间的关系。',['世界本就不公平。我不必因此否定自己的路，也不必拿他人的际遇衡量自己。','如果努力无法有效改变结果，我会重新评估投入。执着本身并不保证价值。','不公平不能决定我是否行动。即使结果无法保证，我仍能决定自己要做什么。','努力与回报之间的联系，可能并没有人们想象得那么可靠。我们只是习惯相信它。'],['real','util','exist','det'],['pess','real','stoic','nih']],
['关于无法挽回','ON IRREPARABLE LOSS','有些失去无法补偿：逝去的时间、离开的人、已经发生的事情。面对不可挽回的事实，你如何理解它？',['失去是生活的一部分。我允许自己悲伤，但不想让它占据余生。','并非所有失去都能带来成长。有些痛苦就是痛苦，无须被美化。','我无法改变过去，却仍能改变它对未来的影响。','遗憾或许不会真正消失。所谓释怀，可能只是学会与它共存。'],['stoic','nih','exist','pess'],['stoic','pess','exist','real']],
['关于宽恕','ON FORGIVENESS','一个曾经伤害你的人，许多年后真诚地道歉，并希望得到你的原谅。你会如何看待这件事？',['如果放下怨恨能让我更自由，我愿意放下，但这不意味着重新建立关系。','理解一个人的处境并不意味着必须原谅。某些行为应当承担后果。','人确实可能改变。我不愿让过去成为衡量一个人永远的标准。','宽恕也许是为了让自己好过，但它并不能改变曾经发生的伤害。'],['stoic','lib','opt','real'],['hed','cyn','opt','pess']],
['关于苦难的意义','ON THE MEANING OF SUFFERING','有人认为痛苦让人理解幸福；也有人认为痛苦并不会自动带来成长，它可能只会使人疲惫、麻木甚至失去一些东西。你更倾向于哪种理解？',['痛苦未必值得，但人有可能在经历之后获得新的理解。意义也可以在后来形成。','幸福来自生活本身，不需要通过征服或解释痛苦才能获得。','痛苦并不保证成长。它可以发生，可以结束，也可以不留下任何值得称赞的东西。','痛苦有时会让原本被忽略的东西显现。如果因此获得某种认识，我也愿意承认它的价值。'],['exist','hed','nih','ideal'],['exist','hed','pess','ideal']]]},
{title:'自由与边界',en:'ON FREEDOM',desc:'自由是否意味着不受限制，还是拥有决定自己如何生活的权利？',qs:[
['关于安全与自由','ON FREEDOM AND SECURITY','你拥有一份稳定、安全、几乎不会发生意外的生活。但它也意味着，你必须遵循一套既定安排，放弃许多自己真正想做的选择。你会如何权衡？',['我更愿意保留生活的愉悦与安稳。自由不意味着必须不断冒险。','如果安全的代价是失去选择权，那么这种安全对我而言并不完整。','人不可能拥有绝对自由。任何选择都受到资源、环境与他人影响。','我愿意承担一部分风险。与其过一种被安排好的生活，我更想知道自己还能走向哪里。'],['hed','lib','det','exist'],['hed','lib','real','ideal']],
['关于规则与越界','ON RULES AND TRANSGRESSION','一条规则被大多数人遵守，也被认为是理所当然。但它限制了某些人的选择，且你并不认同它的合理性。你会如何看待这条规则？',['规则能够维持秩序，不能仅因个人不认同就忽视它。','如果规则侵犯了个人合理的选择权，那么它不应该仅凭被普遍遵守就获得正当性。','规则的存在有其历史与现实原因。比起简单反抗，我更想弄清它为何形成。','社会规则经常被包装成普遍道德，但其中可能包含利益与权力。遵守并不代表认同。'],['real','lib','det','cyn'],['util','lib','real','cyn']],
['关于自由的代价','ON THE COST OF FREEDOM','你可以完全按照自己的意愿生活，但这意味着所有后果都需要由你承担。没有人替你决定，也没有人保证你在错误选择之后仍有退路。你会如何理解这种自由？',['这正是自由的意义。选择属于我，结果也应由我承担。','我并不需要绝对自由。稳定的关系、责任与承诺同样是我主动选择的生活。','所谓自由也许只是一种想象。我们的决定始终受环境与条件制约。','我希望拥有选择权，但不认为自由必须以孤立自己为代价。人可以相互依赖。'],['exist','stoic','det','lib'],['exist','ideal','det','lib']],
['当你不再需要他人的认可','ON APPROVAL AND AUTONOMY','你做出一个重要决定。它不符合身边人的期待，也不会得到赞赏，甚至可能被误解。但你确信这是自己想要的生活。你会如何面对？',['我会继续自己的决定。人生不需要由他人的认可来确认价值。','我会认真考虑他们的意见。不同的视角可能揭示我尚未意识到的问题。','我不需要向任何人证明自己正确。是否被理解，并不改变我选择的事实。','我会感到在意。人不可能完全脱离关系而存在，认可与归属也是真实的需求。'],['lib','real','exist','hed'],['exist','det','stoic','hed']]]},
{title:'命运与因果',en:'ON FATE',desc:'选择是否真的自由？我们能够改变的，是结果、条件，还是面对命运的姿态？',qs:[
['如果一切早有因果','ON CAUSALITY','假设你能够回溯人生中的每一个决定，发现它们都受到过去的经历、环境、性格与当时条件的影响。你以为自己在自由选择，但每一次选择似乎都有迹可循。你会如何理解这种发现？',['即使选择受到条件影响，我仍愿意享受选择本身。自由不必意味着毫无限制。','如果一切皆有来由，那么所谓选择或许只是因果链条中的一个环节。我们只是尚未看清它。','追溯原因并不能取消决定的意义。即使存在必然，我仍需要为自己的生活作出回应。','我不认为人能够彻底理解所有因果。试图证明人生是否注定，或许本身就是一种徒劳。'],['hed','det','exist','nih'],['exist','det','stoic','real']],
['关于无法掌控的事','ON THE UNCONTROLLABLE','你为一件事付出了许多，尽可能做好所有准备。但最终结果仍受到你无法干预的因素影响。面对那些不受意志支配的部分，你更倾向于如何处理？',['接受它的存在，然后把注意力重新放回自己能够改变的地方。','我很难真正接受。既然结果重要，我就会继续寻找尚未尝试的办法。','人总是高估自己的控制力。或许从一开始，就不该将所有结果视为个人意志的延伸。','无法控制不意味着必须放弃。我会保留期待，同时承认事情可能走向任何方向。'],['stoic','ideal','det','opt'],['stoic','real','fatal','opt']],
['如果幸运并不公平','ON THE ARBITRARY NATURE OF LUCK','有人出生便拥有你耗费多年仍未获得的资源、机会与庇护。有人只因一次偶然便改变了命运。面对这种并不按照努力分配的世界，你会如何理解幸运？',['幸运本就没有义务公平。与其追问为何不是我，不如在机会来临时尽可能把握它。','人生的起点与际遇确实决定了许多东西。努力值得肯定，但不应被夸大为万能的解释。','偶然改变不了我对生活的追求。即使世界不公平，我仍然可以决定自己如何走下去。','幸运或许只是尚未被解释的因果。我们称之为偶然，不过是因为不知道它为何发生。'],['hed','det','exist','det'],['real','det','ideal','det']],
['如果你早已知道结局','ON THE INEVITABILITY OF THE END','假如某一天，你获得了一个无法被改变的预言：未来某件你极其珍视的事情注定会失去。你无法阻止它，却可以继续经历从现在到那个结局之间的全部时光。你会如何选择？',['我仍会走向它。尚未发生的失去，不应该提前剥夺此刻拥有的幸福。','如果结局已经确定，我可能会重新衡量投入其中的意义。知道终点后，过程未必还能保持原样。','我不愿意让预言支配我的人生。即使无法改变结果，我也要以自己的方式经历它。','如果命运无法更改，那么提前知晓或许并无区别。无论选择哪条路，我都只是在走向既定的终点。'],['hed','fatal','exist','fatal'],['hed','fatal','lib','fatal']]]},
{title:'人性与社会',en:'ON HUMANITY',desc:'善意、利益、道德与群体：我们究竟相信人，还是相信人所展示的东西？',qs:[
['关于善意与利益','ON KINDNESS AND SELF-INTEREST','有人在没有任何回报的可能下，主动帮助一个与自己毫无关系的人。你认为这样的行为最接近什么？',['善意本身就能带来满足。帮助他人也可能是一个人对自身幸福的追求。','真正不求回报的善意确实存在，但人往往也从中获得情感、价值或自我认同。','即使帮助他人最终会带来某种好处，也不影响它产生真实的积极结果。','我很难相信行动完全没有动机。善意可能存在，但人们常常并不像自己宣称的那么无私。'],['hed','ideal','util','cyn'],['hed','util','cyn','real']],
['当道德与结果发生冲突','ON MORALITY AND CONSEQUENCE','一个决定违背某项原则，却能够让更多人免受伤害。另一个决定坚持原则，却可能造成更糟的结果。面对这样的冲突，你更愿意依据什么作出判断？',['应当尽可能减少实际的伤害。原则不能凌驾于真实的人之上。','某些原则不应因结果而改变。否则，人们总能为自己的行为找到合理借口。','道德判断需要考虑具体情境。脱离现实的原则与脱离原则的结果，都可能产生问题。','这种选择本身就揭示了道德体系的局限。不存在一个永远能让人坦然的答案。'],['util','ideal','real','nih'],['util','ideal','real','nih']],
['当集体要求你牺牲个人','ON THE INDIVIDUAL AND THE COLLECTIVE','一个群体正在追求共同目标，并要求其中某些人放弃自己的利益、选择甚至权利。多数人认为这是必要的。你会如何理解这种要求？',['如果牺牲确实能让更多人获得利益，那么它可能是必要的。','集体目标不能自动获得正当性。个人不应该仅因少数身份就失去自己的权利。','群体需要共同承担代价，而不是将牺牲集中在某些人身上。','我会质疑这个目标本身。所谓共同利益，可能只是被某些人定义出来的利益。'],['util','lib','real','cyn'],['util','lib','ideal','cyn']],
['当善意不再可信','ON TRUST AND SUSPICION','你发现一个长期表现得善良、正直的人，某些行为背后其实存在利益计算。这个发现让你重新审视此前对他的信任。你会如何理解？',['动机不必完全纯粹。只要行为确实带来善意与价值，我仍愿意认可它。','我会重新评估这个人。利益驱动并不可耻，但伪装成纯粹善意值得警惕。','人的动机本就复杂。善意与自利可能同时存在，不必将人划分为纯粹的好或坏。','这并不让我意外。社会中许多道德表象，本就可能掩盖利益、权力与欲望。'],['util','cyn','real','cyn'],['hed','cyn','real','pess']]]},
{title:'理想与不完美',en:'ON PERFECTION',desc:'当理想开始要求代价，标准永远无法抵达，你还愿意相信什么？',qs:[
['当理想开始变得昂贵','ON THE COST OF IDEALS','你曾坚信某件事值得坚持。多年后，你发现继续追求它，需要付出越来越高的代价：时间、关系、安稳，甚至是你原本期待的人生。你开始怀疑，坚守理想是否也可能是一种执念。',['如果它依然值得，我不愿仅仅因为代价变高就放弃。重要的东西，本就未必容易获得。','理想不应该凌驾于生活之上。如果它正在摧毁我所珍视的一切，我会重新考虑它的优先级。','我无法判断坚持与执念的界限。也许只有走到某个阶段，才会知道自己究竟失去了什么。','我会试着改变实现它的方式。信念未必需要以原本的形式存续，才能证明它仍然重要。'],['ideal','hed','pess','real'],['ideal','real','exist','opt']],
['关于无法达到的标准','ON THE UNATTAINABLE STANDARD','你为自己设定了一个标准。每当接近它，你便发现还有更高的要求。即使别人认为你已经做得足够好，你仍然无法对自己的成果感到满意。你如何看待这种状态？',['如果我仍能做得更好，就没有理由在此停下。满意不应该成为停止进步的借口。','标准应当服务于生活，而不是成为衡量自我价值的唯一尺度。','我很难真正放下那个标准。未达到预期的部分，会一直提醒我事情还没有完成。','完美或许只是一个不断后移的目标。人很难判断自己究竟是在接近它，还是在追逐一个不存在的终点。'],['perf','stoic','perf','nih'],['perf','real','perf','nih']],
['如果正确的选择并不美好','ON THE MORAL COMPROMISE','你面临一个选择。遵循自己的原则，可能让事情走向更糟的结果；稍作妥协，却能够让更多人免于伤害。没有任何选项能让你保持完全的坦然，你会如何决定？',['原则不能只在容易的时候才被遵守。若每次都因结果妥协，最终可能连自己相信什么都不剩。','如果能够减少真实的伤害，我愿意接受某种程度的妥协。道德不应只满足于自身的纯粹。','我会试图寻找第三种可能。两难不意味着只能接受现有选项，或许还有尚未被看见的路径。','任何选择都可能在事后被重新解释。我无法确保自己永远正确，只能承担当下判断所带来的后果。'],['ideal','util','exist','real'],['ideal','util','real','nih']],
['如果人生没有理想版本','ON THE IDEAL LIFE','假设你终于明白，人生不会出现一个所有遗憾都被弥补、所有愿望都被实现、所有选择都无可挑剔的版本。你依然有未完成的事、无法修复的关系，以及某些不尽如人意的部分。你会如何看待余生？',['不完满并不意味着不值得。生活本就不需要等到一切妥当，才能被认真对待。','我仍然希望改变能够改变的部分。接受现实与追求更好的生活，并不矛盾。','或许根本不存在所谓理想版本。我们不断设想另一种人生，只是因为无法同时拥有所有可能。','我会慢慢放下对完整人生的执念。人生不必被总结为成功、失败或某种最终答案。'],['hed','ideal','nih','stoic'],['exist','real','nih','stoic']]]}
];
const allQs=chapters.flatMap((c,ci)=>c.qs.map((q,qi)=>({chapter:ci,chapterTitle:c.title,chapterEn:c.en,num:ci*4+qi+1,title:q[0],en:q[1],stem:q[2],options:q[3],primary:q[4],secondary:q[5]})));
let screenIndex=0,answers=[],order=[],chapterIndex=0;
const main=document.getElementById('main');
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function intro(){main.innerHTML=`<section class="screen hero"><div class="mark">Tami · 思想档案</div><div class="eyebrow">A TEST OF YOUR LIFE PHILOSOPHY</div><h1>你的人生主义是什么？<span>What do you believe in?</span></h1><p>我们如何看待快乐、痛苦、自由与命运，或许早已悄悄决定了我们如何度过一生。你相信意义，还是怀疑意义？你追逐远方，还是愿意停在此刻？你试图改变世界，还是学着与世界和解？</p><p>没有正确答案。只有那些在你心中，比其他答案更接近真实的选择。</p><div class="meta">28 QUESTIONS · 7 CHAPTERS · 14 PHILOSOPHIES</div><button class="btn" onclick="startTest()">开始思想漫游 <span>↗</span></button><div class="intro-note">本测试为思想探索与娱乐内容，不构成心理测量或哲学诊断。人生主义并非互斥标签，你可能同时与多种思想产生共鸣。</div></section>`}
function startTest(){answers=Array(28).fill(null);order=allQs.map((_,i)=>i);chapterIndex=0;showChapterIntro(0)}
const chapterEssays=[
`我们常常在徒劳之后，才开始追问一件事是否值得。若一段经历没有留下成果，没有被任何人记住，甚至最终证明它无法改变什么，它是否仍然拥有价值？\n\n意义也许并不总来自抵达。它可能存在于行动本身、某个瞬间的感受，或我们愿意赋予经历的解释之中。本章将从徒劳、选择、记忆与无人见证的生活出发，探问意义究竟来自世界，还是来自我们。`,
`欲望使我们向尚未拥有的事物靠近。得到之后，快乐会褪为日常，新的渴望又在远处出现。我们究竟是在追求幸福，还是不断被“还缺少什么”驱动？\n\n快乐、满足、克制与自由并不总能彼此兼容。本章不把欲望视为贪婪，也不将放弃欲望视为更高尚的选择；它只是邀请你辨认，自己想要的生活究竟是什么。`,
`如果快乐让我们看见所追求的东西，那么痛苦或许会暴露我们真正相信的东西。努力没有回报、失去无法挽回、世界并不公平——这些时刻，既可能改变我们的信念，也可能什么都没有留下。\n\n我们不必为苦难寻找漂亮的解释，也不必把每一次伤害都写成成长。本章想讨论的是：当生活无法被修复或解释，我们如何理解它，又如何继续与它共处。`,
`自由常被想象为没有边界的生活，但真实的选择总伴随着条件、关系与责任。安全可能意味着放弃某些可能性；独立也可能意味着承担孤独与后果。\n\n当规则与个人意愿冲突，当他人的期待无法替你决定人生，当选择不再有保证——你所理解的自由，究竟是摆脱限制，还是在限制之中仍能决定如何生活？`,
`我们习惯将人生理解为选择的结果，却也无法忽略那些先于选择存在的条件：出生、环境、经历、偶然，以及无数无法回溯的因果。\n\n如果一切都有来由，选择是否仍属于我们？如果某些结局无法改变，提前知晓是否会改变我们经历它的方式？本章将把目光放在可控与不可控之间，思考命运、偶然和行动的边界。`,
`我们对人的判断，常在善意与利益、原则与结果之间摇摆。一个行为可以带来真实帮助，却未必出于纯粹动机；一种规则可以维护秩序，也可能要求某些人承担不平等的代价。\n\n当我们看见人性的复杂，是否就意味着不再相信善意？当多数人的利益与个体的权利冲突，我们又该相信哪一种正当性？本章不提供简单的善恶划分，而邀请你审视自己如何理解他人和社会。`,
`理想为生活指向某个更好的可能，但它也可能逐渐变得昂贵。标准不断提高，妥协似乎意味着背叛，而坚持又可能损耗我们曾经珍视的事物。\n\n我们如何区分信念与执念？是否必须做到完美，才有资格满意？当没有一种人生能够修复所有遗憾、实现全部愿望，我们是否仍愿意承认它值得被生活？本章将停留在理想与现实的缝隙中，思考不完美的价值。`
];
function showChapterIntro(ci){chapterIndex=ci;let c=chapters[ci];const paragraphs=chapterEssays[ci].split(/\n\n/).map(t=>`<p>${t}</p>`).join('');main.innerHTML=`<section class=\"screen chapter-head\"><div class=\"chapter-num\">0${ci+1}</div><div class=\"eyebrow\">CHAPTER ${String(ci+1).padStart(2,'0')} · ${c.en}</div><h2>${c.title}</h2><div class=\"chapter-lead\">${paragraphs}</div><div class=\"chapter-chip\">${ci*4+1} — ${ci*4+4} / 28</div><button class=\"btn\" onclick=\"renderQuestion(${ci*4})\">进入本章 <span>→</span></button></section>`}
function renderQuestion(index){screenIndex=index;let q=allQs[index],c=chapters[q.chapter],opts=q.options.map((txt,i)=>({txt,original:i}));const shuffled=shuffle(opts);let chosen=answers[index];main.innerHTML=`<section class="screen question"><div class="q-meta">CHAPTER ${String(q.chapter+1).padStart(2,'0')} / ${q.chapterEn}　·　QUESTION ${String(q.num).padStart(2,'0')} / 28</div><div class="progress-wrap"><div class="progress" style="width:${((index+1)/28)*100}%"></div></div><h3>${q.title}</h3><div class="q-en">${q.en}</div><p class="stem">${q.stem}</p><div class="options">${shuffled.map((o,oi)=>`<button class="option ${chosen===o.original?'selected':''}" onclick="selectOption(${index},${o.original})" data-option-index="${o.original}"><span class="letter">${String.fromCharCode(65+oi)}</span><span>${o.txt}</span></button>`).join('')}</div><div class="navrow"><button class="btn secondary" onclick="${index===0?'intro()':`renderQuestion(${index-1})`}">← 上一题</button><button id="next-btn" class="btn" onclick="nextQuestion(${index})" ${chosen===null?'disabled style="opacity:.4;cursor:not-allowed"':''}>${index===27?'查看结果':'下一题'} →</button></div><p class="smallprint">你的选择不会被评价。请选更接近真实想法的答案，而不是看起来最正确的答案。</p></section>`}
function selectOption(i,oi){answers[i]=oi;const buttons=main.querySelectorAll('.option');buttons.forEach(b=>b.classList.toggle('selected',Number(b.dataset.optionIndex)===oi));const next=main.querySelector('#next-btn');if(next){next.disabled=false;next.style.opacity='1';next.style.cursor='pointer';}}
function nextQuestion(i){if(answers[i]===null)return;if(i===27)showResults();else if((i+1)%4===0)showChapterIntro(Math.floor((i+1)/4));else renderQuestion(i+1)}
function calcScores(){let s={};types.forEach(t=>s[t.id]=0);allQs.forEach((q,i)=>{let a=answers[i];if(a===null)return;let primary=q.primary[a],secondary=q.secondary[a];s[primary]+=2.3;s[secondary]+=1.25; // double-weight main answer dimension
});let max=Math.max(...Object.values(s));let min=Math.min(...Object.values(s));let norm={};types.forEach(t=>{norm[t.id]=Math.round((s[t.id]/max)*100)});return {raw:s,norm}}
function pairTension(a,b){const pairs={
'hed|perf':['享乐主义 × 完美主义','渴望享受生活，却也可能不允许自己轻易满足。','你一方面希望生活带来愉悦，另一方面又可能不断提高享受生活的标准。快乐因此既是目的，也可能变成一项需要被完成的任务。'],
'exist|nih':['存在主义 × 虚无主义','不断创造意义，同时怀疑意义是否成立。','你并不完全相信人生存在既定答案，却也没有因此停止选择。你可能一边拆解意义，一边仍然需要某些东西值得投入。'],
'ideal|real':['理想主义 × 现实主义','看见世界的缺陷，却也看见改变的成本。','你相信世界应该有所不同，却也清楚世界未必会因此改变。你既无法完全接受现状，也不愿让愿望替代事实。'],
'opt|cyn':['乐观主义 × 犬儒主义','仍然期待未来，却不轻易相信人性。','你愿意相信事情可能改善，却不轻易相信人们展示出来的动机。希望与怀疑在你身上并不互相取消。'],
'lib|det':['自由主义 × 决定论','渴望自主，却认为选择从未脱离因果。','你重视选择权，同时承认选择受到环境、经历与条件塑造。自由对你不是毫无约束，而是在理解限制后仍保有权利。'],
'stoic|hed':['斯多葛主义 × 享乐主义','一边减少欲望，一边珍惜感官与生活的愉悦。','你既想不被欲望牵制，也不想把克制变成拒绝生活。你在享受与节制之间寻找自己的尺度。'],
'util|ideal':['功利主义 × 理想主义','既追求实际价值，又不愿让原则失去作用。','你希望信念能够改善现实，而不只是停留在立场上；也不愿让结果计算抹去价值本身。'],
'fatal|exist':['宿命论 × 存在主义','怀疑结局不可更改，却仍在选择如何生活。','你可能承认某些结果不由意志决定，但仍在意自己如何走过这段过程。无法掌控终点，不等于过程毫无意义。'],
'pess|opt':['悲观主义 × 乐观主义','预见失望，却仍为可能性保留位置。','你并不盲目期待，却也没有完全封闭未来。谨慎与希望同时存在，使你既看见风险，也愿意等待变化。'],
'cyn|util':['犬儒主义 × 功利主义','怀疑动机，却仍以结果判断行为的价值。','你不一定相信人们行动的理由都纯粹，但仍会关注行为是否真正改善处境。你对动机存疑，对结果却并非漠然。']};let key=[a,b].sort().join('|');return pairs[key]||null}
function showResults(){const {raw,norm}=calcScores();let sorted=types.map(t=>({...t,score:norm[t.id],raw:raw[t.id]})).sort((a,b)=>b.raw-a.raw);let top=sorted[0],second=sorted[1],third=sorted[2];let confidence=top.raw-second.raw;let structure=confidence>4?'思想聚焦':confidence<=1?'多元开放':'内在张力';let tension=pairTension(top.id,second.id)||[`${top.name} × ${second.name}`,'两种思想倾向在你身上同时出现。','你并不完全由某一种思想解释。第一倾向提供主要方向，第二倾向则让你的判断保留另一种尺度。它们未必总能一致，却共同构成你看待生活的方式。'];let reports=[...top.report];const rankHtml=sorted.map((t,i)=>`<div class="rank-row"><div class="rank-no">${String(i+1).padStart(2,'0')}</div><div><div class="rank-name">${t.name}</div><div class="rank-track"><div class="rank-fill" style="width:${t.score}%;opacity:${i===0?1:.72}"></div></div></div><div class="rank-value">${t.score}</div></div>`).join('');main.innerHTML=`<section id="results" class="screen"><section class="result-section"><div class="result-kicker">01 · YOUR DOMINANT PHILOSOPHY</div><div class="result-top"><div class="eyebrow">${top.en} · PERSONAL PHILOSOPHY</div><h1 class="philosophy-name">${top.name}</h1><div class="alias">${top.alias}</div><div class="result-flex"><div class="score-side"><div class="score-big">${top.score}</div><div class="score-label">AFFINITY INDEX</div></div><div style="flex:1"><div class="result-quote">“${top.quote}”</div></div></div><div class="score-meter"><div style="width:${top.score}%"></div></div><div class="smallprint">哲学倾向指数 · 非科学测量结果</div></div><h3>你的思想底色</h3><p>${top.desc}</p><h3>当这种思想走向极端</h3><p>${top.shadow}</p></section>
<section class="result-section"><div class="result-kicker">02 · THE LANDSCAPE OF YOUR MIND</div><h2>你的思想地形</h2><p>你并非只由一种主义构成。以下分布呈现你在14种思想维度中的相对倾向。</p><div class="radar-wrap"><canvas id="radar" width="440" height="440"></canvas></div><div class="smallprint">各维度按本次答题映射归一化展示，仅用于自我探索。</div></section>
<section class="result-section"><div class="result-kicker">03 · THE ORDER OF AFFINITY</div><h2>你与14种主义的距离</h2><p>排名不是优劣顺序。分数较低的哲学不代表你缺乏对应能力，只表示本次回答与该思想的契合度相对较低。</p><div class="ranking">${rankHtml}</div></section>
<section class="result-section"><div class="result-kicker">04 · THE CONTRADICTIONS WITHIN</div><h2>你的思想矛盾</h2><div class="tension-card"><div class="eyebrow">YOUR PHILOSOPHICAL TENSION</div><h3>${tension[0]}</h3><div class="result-quote">“${tension[1]}”</div><p>${tension[2]}</p></div><h3>思想的确定性：${structure}</h3><p>${confidence>4?'你的第一倾向与第二倾向之间有一定距离，当前结果呈现出相对集中的思想方向。不过，单一高分并不意味着你没有复杂性。':confidence<=1?'你的前两种倾向相近，没有一种思想完全压过另一种。你可能会根据情境切换判断尺度，也可能同时保留彼此不同的信念。':'你的主要倾向并非完全独占。第二种思想在你身上仍有相当位置，可能使你在不同处境中产生内部讨论。'}</p></section>
<section class="result-section"><div class="result-kicker">05 · A PHILOSOPHICAL PORTRAIT</div><h2>你的人生哲学报告</h2><p class="result-quote">这不是对你的定论，而是从你所选择的答案中，描摹出的一种思想轮廓。</p>${reports.map((txt,i)=>`<div class="report-block"><div class="label">0${i+1} — ${['YOUR VIEW OF LIFE','YOUR VIEW OF HAPPINESS','YOUR VIEW OF SUFFERING','YOUR VIEW OF OTHERS','YOUR VIEW OF THE FUTURE'][i]}</div><h3>${['你如何理解人生','你如何理解幸福','你如何面对痛苦','你如何理解他人与世界','你如何走向未来'][i]}</h3><p>${txt}</p></div>`).join('')}<div class="report-block"><div class="label">A NOTE ON YOUR SECONDARY PHILOSOPHY</div><h3>次倾向：${second.name} · ${second.alias}</h3><p>${second.desc}</p></div><div class="report-block"><div class="label">YOUR THIRD TENDENCY</div><h3>第三倾向：${third.name}</h3><p>${third.desc}</p></div><p class="report-foot">本报告由答题倾向生成，属于娱乐与自我探索内容。哲学思想具有复杂的历史脉络，本测试仅采用简化维度，不代表学术分类或心理诊断。</p></section>
<section class="result-section"><div class="finale"><div class="eyebrow">END OF REPORT · TAMI</div><h2>你不必成为某一种主义。</h2><p>思想并不是一座需要抵达的终点。</p><p>你可以相信意义，又怀疑意义；可以追求自由，又渴望归属；可以看清现实，依然不愿放弃理想。</p><p>这些并不使你变得矛盾而失去一致性。</p><p style="color:var(--accent);font-style:italic">它们只是意味着，你仍然在思考如何生活。</p></div><div class="result-actions"><button class="btn" onclick="window.print()">保存 / 打印报告</button><button class="btn secondary" onclick="shareResult('${top.name}','${top.alias}')">分享结果</button><button class="btn secondary" onclick="intro()">重新探索</button></div><p class="smallprint">打印时可选择“保存为 PDF”。分享功能会复制简短结果文本。</p></section></section>`;drawRadar(sorted);window.scrollTo({top:0,behavior:'smooth'})}
function drawRadar(sorted){const canvas=document.getElementById('radar');if(!canvas)return;const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;let size=440;canvas.width=size*dpr;canvas.height=size*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,size,size);const cx=size/2,cy=size/2,r=145;const data=types.map(t=>({name:t.name,val:calcScores().norm[t.id]}));ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';for(let ring=1;ring<=4;ring++){ctx.beginPath();for(let i=0;i<14;i++){let a=-Math.PI/2+i*2*Math.PI/14,rr=r*ring/4,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle='#d6cbbb';ctx.lineWidth=1;ctx.stroke()}for(let i=0;i<14;i++){let a=-Math.PI/2+i*2*Math.PI/14,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#d6cbbb';ctx.stroke();let lx=cx+Math.cos(a)*(r+25),ly=cy+Math.sin(a)*(r+25);ctx.fillStyle='#776c5e';ctx.fillText(types[i].name,lx,ly)}ctx.beginPath();data.forEach((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/14,rr=r*d.val/100,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(184,101,69,.16)';ctx.fill();ctx.strokeStyle='#b86545';ctx.lineWidth=2;ctx.stroke();data.forEach((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/14,rr=r*d.val/100,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#b86545';ctx.fill()})}
function shareResult(name,alias){const text=`我的人生主义测试结果：${name}｜${alias}\n「你不必成为某一种主义。」\n28题 · 14种哲学维度 · Tami`;if(navigator.share){navigator.share({title:'你的人生主义是什么？',text}).catch(()=>copyText(text))}else copyText(text)}function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('分享文案已复制')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}function fallbackCopy(t){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('分享文案已复制')}catch(e){alert(t)}ta.remove()}
intro();
